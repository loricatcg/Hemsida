<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lorica TCG</title>
    <style>
        body {
            background-color: #0d1117;
            color: #f0f6fc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
        }
        .logo {
            max-width: 180px;
            width: 100%;
            height: auto;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }
        p {
            color: #8b949e;
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 32px;
        }
        .social-links {
            display: flex;
            gap: 16px;
            justify-content: center;
        }
        .btn {
            background-color: #21262d;
            color: #f0f6fc;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 500;
            border: 1px solid #30363d;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .btn:hover {
            background-color: #30363d;
            border-color: #8b949e;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Byt ut 'logo.png' till namnet på din logotypbild -->
        <img src="logo.png" alt="Lorica TCG Logo" class="logo">
        
        <h1>Kvalitetstid för dina kort. Utan överpriser.</h1>
        
        <p>Vi bygger något nytt för alla svenska TCG-samlare. Inom kort öppnar vi shoppen med marknadens mest prisvärda tillbehör.</p>
        
        <div class="social-links">
            <a href="https://www.instagram.com/loricatcg/" target="_blank" class="btn">Instagram</a>
            <a href="https://www.tiktok.com/@loricatcg" target="_blank" class="btn">TikTok</a>
        </div>
    </div>

</body>
</html>
